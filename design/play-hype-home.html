<!DOCTYPE html>
<html lang="en" width="1440" height="1300">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAY HYPE GAMES</title>
<style>
  :root{
    --sky:#cfd9f5;
    --font:"Segoe UI","PingFang SC",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{width:1440px;height:1300px}
  body{width:1440px;height:1300px;font-family:var(--font);background:var(--sky);overflow:hidden}
  .root{position:relative;width:1440px;height:1300px;overflow:hidden}

  /* ===== 背景层 ===== */
  .sky{position:absolute;inset:0}
  .sky img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .sky::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,transparent 26%,rgba(255,255,255,.30) 60%,rgba(255,255,255,.88) 88%,#f6f8ff 100%)}

  /* ===== 导航 ===== */
  .nav{position:absolute;left:40px;right:40px;top:30px;height:72px;border-radius:36px;
    background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.62);
    box-shadow:0 10px 26px rgba(60,110,180,.16),inset 0 1px 0 rgba(255,255,255,.7);
    display:flex;align-items:center;padding:0 24px 0 28px;z-index:5}
  .brand{display:flex;align-items:center;gap:9px;font-size:27px;font-weight:800;letter-spacing:.5px;
    color:#fff;-webkit-text-stroke:2.4px #2f6fb3;paint-order:stroke fill;
    filter:drop-shadow(0 3px 0 rgba(37,90,150,.5))}
  .crown{width:24px;height:19px;flex:none;
    filter:drop-shadow(0 2px 3px rgba(180,120,0,.3))}
  .links{display:flex;gap:40px;margin-left:auto;margin-right:52px;
    font-size:21px;font-weight:700;letter-spacing:.6px;color:#fff;
    text-shadow:0 2px 4px rgba(40,90,150,.4)}
  .links a{color:#fff;text-decoration:none}
  .links a.on{color:#8cff45;text-shadow:0 2px 0 #2d6b1b,0 0 16px rgba(140,255,69,.55)}
  .search{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.6);
    border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;flex:none}
  .search svg{width:20px;height:20px;stroke:#3b7ec2;stroke-width:2.4;fill:none}

  /* ===== Hero：掌机图片层 + HTML 文案层 ===== */
  .pad-wrap{position:absolute;left:50%;top:112px;width:880px;margin-left:-440px;
    filter:drop-shadow(0 30px 44px rgba(70,110,170,.34))}
  .pad{width:880px;display:block;transform:rotate(-1.5deg)}
  /* 文字块对准掌机屏幕：屏幕中心在机身约 42.5% / 47% 处 */
  .screen-copy{position:absolute;left:42.5%;top:166px;width:346px;margin-left:-173px;text-align:center}
  .h1{font-size:33px;line-height:1.04;font-weight:900;letter-spacing:-.3px;color:#fff;
    -webkit-text-stroke:3px #2e6cb2;paint-order:stroke fill;
    filter:drop-shadow(0 4px 0 rgba(32,80,140,.5)) drop-shadow(0 8px 14px rgba(30,70,130,.28))}
  .sub{margin-top:8px;font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px;
    text-shadow:0 2px 4px rgba(25,70,130,.65)}
  .cta{display:inline-flex;align-items:center;gap:7px;margin-top:11px;
    height:46px;padding:0 26px;border-radius:23px;font-size:18px;font-weight:900;letter-spacing:.6px;
    color:#fff;text-shadow:0 2px 0 rgba(190,90,0,.45);
    background:linear-gradient(180deg,#ffe35c,#ffb81f 52%,#ff9421);
    box-shadow:0 6px 0 #e07a12,0 10px 18px rgba(220,130,20,.36),inset 0 2px 0 rgba(255,255,255,.75)}
  .cta svg{width:16px;height:16px;fill:#fff}

  /* ===== 分类 ===== */
  .tabs{position:absolute;left:40px;right:40px;top:716px;display:flex;gap:13px;z-index:5}
  .tab{height:58px;padding:0 28px;border-radius:29px;display:flex;align-items:center;
    font-size:20px;font-weight:800;color:#fff;letter-spacing:.4px;cursor:pointer;
    background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.85);
    box-shadow:0 7px 14px rgba(70,120,190,.18);
    text-shadow:0 2px 4px rgba(40,90,150,.4);
    transition:transform .15s ease, box-shadow .15s ease}
  .tab:hover{transform:translateY(-2px)}
  .tab.on{background:linear-gradient(180deg,#a8ff63,#4ce02a);
    box-shadow:0 7px 0 #2ba50f,0 12px 20px rgba(60,200,40,.35),inset 0 2px 0 rgba(255,255,255,.6);
    text-shadow:0 2px 0 #2d7d14}

  /* ===== 卡片区（数据驱动） ===== */
  .grid{position:absolute;left:40px;right:40px;top:796px;
    display:grid;grid-template-columns:repeat(6,1fr);gap:18px;z-index:5}
  .card{position:relative;display:block;border-radius:18px;overflow:hidden;text-decoration:none;
    background:#fff;border:3px solid rgba(255,255,255,.96);
    box-shadow:0 12px 22px rgba(60,110,175,.26),inset 0 0 0 1px rgba(120,160,215,.22);
    transition:transform .18s ease,box-shadow .18s ease}
  .card:hover{transform:translateY(-5px);box-shadow:0 20px 32px rgba(60,110,175,.34)}
  .cover{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover.fallback{display:grid;place-items:center;
    background:radial-gradient(circle at 26% 22%,var(--c1),transparent 64%),
               radial-gradient(circle at 80% 84%,var(--c2),transparent 60%),
               linear-gradient(140deg,#33406b,#1d2547)}
  .cover.fallback span{font-size:52px;font-weight:900;color:#fff;
    -webkit-text-stroke:4px rgba(255,255,255,.35);paint-order:stroke fill;
    opacity:.92}
  .title{position:absolute;left:0;right:0;top:0;padding:10px 13px;
    font-size:18px;line-height:1.12;font-weight:900;color:#fff;letter-spacing:.1px;
    -webkit-text-stroke:2.6px #2b5f9e;paint-order:stroke fill;
    filter:drop-shadow(0 2px 0 rgba(30,70,130,.5));
    text-shadow:0 2px 6px rgba(20,50,90,.45)}
  .tag{position:absolute;left:11px;bottom:11px;height:26px;padding:0 13px;border-radius:13px;
    display:flex;align-items:center;font-size:13px;font-weight:800;color:#fff;letter-spacing:.3px;
    box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5)}
  .heat{position:absolute;right:11px;bottom:11px;height:26px;padding:0 10px;border-radius:13px;
    display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#fff;
    background:rgba(18,38,68,.48)}
  .heat svg{width:11px;height:11px;fill:#ffd84d}

  /* ===== 底栏 ===== */
  .foot{position:absolute;left:40px;right:40px;bottom:40px;z-index:5}
  .searchbar{height:68px;border-radius:34px;background:rgba(255,255,255,.78);
    border:2px solid rgba(255,255,255,.92);display:flex;align-items:center;
    padding:0 28px;gap:13px;box-shadow:0 12px 26px rgba(60,110,180,.18)}
  .searchbar svg{width:22px;height:22px;stroke:#4a88c8;stroke-width:2.4;fill:none}
  .searchbar span{font-size:19px;font-weight:700;color:#8fb0d2}
  .legal{margin-top:14px;text-align:center;font-size:14px;font-weight:600;color:#7fa2c8}
</style>
</head>
<body>
<div class="root" data-canvas-root>

  <div class="sky" aria-hidden="true"><img src="./assets/sky.webp" alt=""></div>

  <header class="nav">
    <div class="brand">
      <svg class="crown" viewBox="0 0 26 20" aria-hidden="true">
        <path d="M2 18h22l2-13-7 5-4-8-4 8-7-5z" fill="#ffd23e" stroke="#e0a516" stroke-width="1.4"/>
      </svg>
      PLAY HYPE GAMES
    </div>
    <nav class="links">
      <a class="on" href="#">NEW</a>
      <a href="#">TRENDING</a>
      <a href="#">IO</a>
      <a href="#">IDLE</a>
      <a href="#">MULTIPLAYER</a>
      <a href="#">CHROMEBOOK</a>
    </nav>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    </div>
  </header>

  <section class="pad-wrap">
    <img class="pad" src="./assets/pad.webp" alt="Handheld console">
    <div class="screen-copy">
      <div class="h1">PLAY THE BEST<br>BROWSER GAMES</div>
      <div class="sub">Free, instant, updated daily</div>
      <div class="cta">PLAY NOW
        <svg viewBox="0 0 24 24"><path d="M4 11h13l-5-5 1.4-1.4L21 12l-7.6 7.4L12 18l5-5H4z"/></svg>
      </div>
    </div>
  </section>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>

  <footer class="foot">
    <div class="searchbar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <span>Search games...</span>
    </div>
    <div class="legal">Play free browser games. No download required.</div>
  </footer>

</div>

<script>
/* 游戏数据。接后台/接口后只需替换这个数组，卡片区自动跟着变。
   heat: 热度分，用于默认排序；cover 为空自动降级为渐变卡片 */
const GAMES = [
  { id:1,  title:"Super Idle Farm", tag:"Idle",     color:"#8fd35f", heat:982, cat:"idle",     cover:"./assets/cover-1.webp" },
  { id:2,  title:"Slime IO 2",      tag:"IO",       color:"#7fb2ff", heat:945, cat:"io",       cover:"./assets/cover-2.webp" },
  { id:3,  title:"Cookie Kingdom",  tag:"Arcade",   color:"#ff8fc0", heat:910, cat:"arcade",   cover:"./assets/cover-3.webp" },
  { id:4,  title:"Pocket Miner",    tag:"Strategy", color:"#f2b04a", heat:888, cat:"strategy", cover:"./assets/cover-4.webp" },
  { id:5,  title:"Monster Clicker", tag:"Idle",     color:"#a78bfa", heat:861, cat:"idle",     cover:"./assets/cover-5.webp" },
  { id:6,  title:"Racing Go",       tag:"Racing",   color:"#4fb3ff", heat:842, cat:"racing",   cover:"./assets/cover-6.webp" },
  { id:7,  title:"Harvest Honors",  tag:"Strategy", color:"#e0a533", heat:520, cat:"strategy", cover:"" },
  { id:8,  title:"Bubble Woods",    tag:"Arcade",   color:"#6fd8b0", heat:470, cat:"arcade",   cover:"" },
  { id:9,  title:"Sugar Heroes",    tag:"Puzzle",   color:"#ff9bd8", heat:455, cat:"puzzle",   cover:"" },
  { id:10, title:"Mineblock",       tag:"Sandbox",  color:"#9b8b74", heat:430, cat:"sandbox",  cover:"" },
  { id:11, title:"Dungeon Tales",   tag:"RPG",      color:"#8b7dff", heat:402, cat:"rpg",      cover:"" },
  { id:12, title:"Car Racing",      tag:"Racing",   color:"#3f9cf0", heat:380, cat:"racing",   cover:"" }
];

const TABS = [
  { key:"all", label:"ALL" },
  { key:"new", label:"NEW" },
  { key:"io",  label:"IO" },
  { key:"idle",label:"IDLE" },
  { key:"arcade", label:"ARCADE" },
  { key:"2p",  label:"2P" },
  { key:"chromebook", label:"CHROMEBOOK" }
];

let activeTab = "all";

function cardHTML(g){
  const fallback = !g.cover;
  return `<a class="card" href="#" data-id="${g.id}">
    <div class="cover ${fallback?"fallback":""}" style="--c1:${g.color};--c2:${g.color}">
      ${fallback ? `<span>${g.title.charAt(0)}</span>`
                 : `<img src="${g.cover}" loading="lazy" decoding="async" alt="${g.title}">`}
    </div>
    <div class="title">${g.title}</div>
    <span class="tag" style="background:${g.color}">${g.tag}</span>
    <span class="heat">
      <svg viewBox="0 0 24 24"><path d="M12 2c3.4 4.4 6 7 6 10.6A6 6 0 0 1 6 12.6C6 11 6.7 9.7 7.8 8.5c.5 1.6 1.1 2.3 2 2.9-.5-2.7.3-5.2 2.2-9.4z"/></svg>
      ${g.heat}</span>
  </a>`;
}

function visibleGames(){
  let list = GAMES.slice();
  if (activeTab === "new") return list.sort((a,b)=>b.id-a.id);
  if (activeTab !== "all") list = list.filter(g=>g.cat===activeTab);
  return list.sort((a,b)=>b.heat-a.heat);
}

function render(){
  document.getElementById("grid").innerHTML = visibleGames().map(cardHTML).join("");
}

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(t=>
    `<div class="tab ${t.key===activeTab?"on":""}" data-key="${t.key}">${t.label}</div>`).join("");
  el.querySelectorAll(".tab").forEach(n=>n.addEventListener("click",()=>{
    activeTab = n.dataset.key; renderTabs(); render();
  }));
}
renderTabs(); render();
</script>
</body>
</html>
