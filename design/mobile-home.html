<!DOCTYPE html>
<html lang="en" width="390" height="860">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAY HYPE GAMES</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{width:390px;height:860px}
  body{width:390px;height:860px;overflow:hidden;background:#cfd9f5;
    font-family:"Segoe UI","PingFang SC",system-ui,-apple-system,sans-serif}
  .root{position:relative;width:390px;height:860px;overflow:hidden}

  /* 背景 */
  .sky{position:absolute;inset:0}
  .sky img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .sky::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.12) 0,transparent 28%,
      rgba(255,255,255,.34) 62%,rgba(255,255,255,.9) 90%,#f6f8ff 100%)}

  /* 导航：极简胶囊，链接全收进菜单 */
  .nav{position:absolute;left:12px;right:12px;top:12px;height:54px;border-radius:27px;
    background:rgba(255,255,255,.4);border:1.5px solid rgba(255,255,255,.68);
    box-shadow:0 6px 16px rgba(60,110,180,.16),inset 0 1px 0 rgba(255,255,255,.7);
    display:flex;align-items:center;padding:0 12px 0 14px;z-index:6}
  .brand{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:800;letter-spacing:.3px;
    color:#fff;-webkit-text-stroke:1.6px #2f6fb3;paint-order:stroke fill;
    filter:drop-shadow(0 2px 0 rgba(37,90,150,.5));white-space:nowrap}
  .crown{width:14px;height:11px;flex:none}
  .nav-r{margin-left:auto;display:flex;align-items:center;gap:8px}
  .iconbtn{width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.6);
    border:1.5px solid rgba(255,255,255,.85);display:grid;place-items:center}
  .iconbtn svg{width:15px;height:15px;stroke:#3b7ec2;stroke-width:2.4;fill:none}
  .burger svg{stroke-width:2.6}

  /* Hero */
  .pad-wrap{position:absolute;left:50%;top:82px;width:330px;margin-left:-165px;
    filter:drop-shadow(0 16px 22px rgba(70,110,170,.36))}
  .pad{width:330px;display:block;transform:rotate(-1.5deg)}
  .screen-copy{position:absolute;left:43%;top:52px;width:170px;margin-left:-85px;text-align:center}
  .h1{font-size:17px;line-height:1.08;font-weight:900;letter-spacing:-.2px;color:#fff;
    -webkit-text-stroke:2px #2e6cb2;paint-order:stroke fill;
    filter:drop-shadow(0 3px 0 rgba(32,80,140,.5))}
  .cta{display:inline-flex;align-items:center;gap:4px;margin-top:9px;
    height:28px;padding:0 14px;border-radius:14px;font-size:12px;font-weight:900;letter-spacing:.4px;
    color:#fff;text-shadow:0 1px 0 rgba(190,90,0,.5);
    background:linear-gradient(180deg,#ffe35c,#ffb81f 52%,#ff9421);
    box-shadow:0 4px 0 #e07a12,0 6px 12px rgba(220,130,20,.35),inset 0 1px 0 rgba(255,255,255,.75)}
  .cta svg{width:11px;height:11px;fill:#fff}

  /* 分类：单行横滑 */
  .tabs{position:absolute;left:0;right:0;top:312px;display:flex;gap:8px;padding:0 14px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;z-index:6}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:38px;padding:0 18px;border-radius:19px;display:flex;align-items:center;
    font-size:14px;font-weight:800;color:#fff;letter-spacing:.3px;cursor:pointer;
    background:rgba(255,255,255,.58);border:1.5px solid rgba(255,255,255,.88);
    box-shadow:0 5px 10px rgba(70,120,190,.16);
    text-shadow:0 1px 3px rgba(40,90,150,.4)}
  .tab.on{background:linear-gradient(180deg,#a8ff63,#4ce02a);
    box-shadow:0 5px 0 #2ba50f,0 8px 14px rgba(60,200,40,.32),inset 0 2px 0 rgba(255,255,255,.6);
    text-shadow:0 1.5px 0 #2d7d14}

  /* 卡片：2 列 */
  .grid{position:absolute;left:14px;right:14px;top:366px;
    display:grid;grid-template-columns:1fr 1fr;gap:12px;z-index:6}
  .card{position:relative;display:block;border-radius:14px;overflow:hidden;
    background:#fff;border:2px solid rgba(255,255,255,.96);
    box-shadow:0 8px 16px rgba(60,110,175,.24),inset 0 0 0 1px rgba(120,160,215,.2)}
  .cover{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover.fallback{display:grid;place-items:center;
    background:radial-gradient(circle at 26% 22%,var(--c1),transparent 64%),
               radial-gradient(circle at 80% 84%,var(--c2),transparent 60%),
               linear-gradient(140deg,#33406b,#1d2547)}
  .cover.fallback span{font-size:34px;font-weight:900;color:#fff;
    -webkit-text-stroke:3px rgba(255,255,255,.32);paint-order:stroke fill;opacity:.92}
  .title{position:absolute;left:0;right:0;top:0;padding:7px 9px;
    font-size:14px;line-height:1.1;font-weight:900;color:#fff;
    -webkit-text-stroke:2px #2b5f9e;paint-order:stroke fill;
    filter:drop-shadow(0 1.5px 0 rgba(30,70,130,.5));
    text-shadow:0 2px 5px rgba(20,50,90,.45)}
  .tag{position:absolute;left:7px;bottom:7px;height:20px;padding:0 9px;border-radius:10px;
    display:flex;align-items:center;font-size:11px;font-weight:800;color:#fff;
    box-shadow:0 2px 0 rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.45)}
  .heat{position:absolute;right:7px;bottom:7px;height:20px;padding:0 7px;border-radius:10px;
    display:flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:#fff;
    background:rgba(18,38,68,.46)}
  .heat svg{width:8px;height:8px;fill:#ffd84d}

  /* 底栏 */
  .foot{position:absolute;left:14px;right:14px;bottom:20px;z-index:6}
  .searchbar{height:50px;border-radius:25px;background:rgba(255,255,255,.8);
    border:1.5px solid rgba(255,255,255,.92);display:flex;align-items:center;
    padding:0 18px;gap:9px;box-shadow:0 8px 18px rgba(60,110,180,.16)}
  .searchbar svg{width:16px;height:16px;stroke:#4a88c8;stroke-width:2.4;fill:none}
  .searchbar span{font-size:14px;font-weight:700;color:#8fb0d2}
  .legal{margin-top:9px;text-align:center;font-size:10px;font-weight:600;color:#7fa2c8}
</style>
</head>
<body>
<div class="root" data-canvas-root>

  <div class="sky" aria-hidden="true"><img src="./assets/sky-m.webp" alt=""></div>

  <header class="nav">
    <div class="brand">
      <svg class="crown" viewBox="0 0 26 20" aria-hidden="true">
        <path d="M2 18h22l2-13-7 5-4-8-4 8-7-5z" fill="#ffd23e" stroke="#e0a516" stroke-width="1.4"/>
      </svg>
      PLAY HYPE GAMES
    </div>
    <div class="nav-r">
      <div class="iconbtn">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      </div>
      <div class="iconbtn burger">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </div>
    </div>
  </header>

  <section class="pad-wrap">
    <img class="pad" src="./assets/pad-m.webp" alt="Handheld console">
    <div class="screen-copy">
      <div class="h1">PLAY THE BEST<br>BROWSER GAMES</div>
      <div class="cta">PLAY NOW
        <svg viewBox="0 0 24 24"><path d="M4 11h13l-5-5 1.4-1.4L21 12l-7.6 7.4L12 18l5-5H4z"/></svg>
      </div>
    </div>
  </section>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>

  <footer class="foot">
    <div class="searchbar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <span>Search games...</span>
    </div>
    <div class="legal">Play free browser games. No download required.</div>
  </footer>

</div>

<script>
/* 同一份游戏数据，手机上只渲染前 6 个（后面的进分类页） */
const GAMES = [
  { id:1, title:"Super Idle Farm", tag:"Idle",     color:"#8fd35f", heat:982, cat:"idle",     cover:"./assets/cover-1.webp" },
  { id:2, title:"Slime IO 2",      tag:"IO",       color:"#7fb2ff", heat:945, cat:"io",       cover:"./assets/cover-2.webp" },
  { id:3, title:"Cookie Kingdom",  tag:"Arcade",   color:"#ff8fc0", heat:910, cat:"arcade",   cover:"./assets/cover-3.webp" },
  { id:4, title:"Pocket Miner",    tag:"Strategy", color:"#f2b04a", heat:888, cat:"strategy", cover:"./assets/cover-4.webp" },
  { id:5, title:"Monster Clicker", tag:"Idle",     color:"#a78bfa", heat:861, cat:"idle",     cover:"./assets/cover-5.webp" },
  { id:6, title:"Racing Go",       tag:"Racing",   color:"#4fb3ff", heat:842, cat:"racing",   cover:"./assets/cover-6.webp" },
  { id:7, title:"Harvest Honors",  tag:"Strategy", color:"#e0a533", heat:520, cat:"strategy", cover:"" },
  { id:8, title:"Bubble Woods",    tag:"Arcade",   color:"#6fd8b0", heat:470, cat:"arcade",   cover:"" }
];

const TABS = [
  { key:"all", label:"ALL" },
  { key:"new", label:"NEW" },
  { key:"io",  label:"IO" },
  { key:"idle",label:"IDLE" },
  { key:"arcade", label:"ARCADE" },
  { key:"2p",  label:"2P" },
  { key:"chromebook", label:"CHROMEBOOK" }
];

let activeTab = "all";
const LIMIT = 6;   // 首屏只出 6 张，其余进分类页

function cardHTML(g){
  const fb = !g.cover;
  return `<a class="card" href="#">
    <div class="cover ${fb?"fallback":""}" style="--c1:${g.color};--c2:${g.color}">
      ${fb ? `<span>${g.title.charAt(0)}</span>`
           : `<img src="${g.cover}" loading="lazy" decoding="async" alt="${g.title}">`}
    </div>
    <div class="title">${g.title}</div>
    <span class="tag" style="background:${g.color}">${g.tag}</span>
    <span class="heat">
      <svg viewBox="0 0 24 24"><path d="M12 2c3.4 4.4 6 7 6 10.6A6 6 0 0 1 6 12.6C6 11 6.7 9.7 7.8 8.5c.5 1.6 1.1 2.3 2 2.9-.5-2.7.3-5.2 2.2-9.4z"/></svg>
      ${g.heat}</span>
  </a>`;
}

function visible(){
  let list = GAMES.slice();
  if (activeTab === "new") return list.sort((a,b)=>b.id-a.id).slice(0,LIMIT);
  if (activeTab !== "all") list = list.filter(g=>g.cat===activeTab);
  return list.sort((a,b)=>b.heat-a.heat).slice(0,LIMIT);
}

function render(){
  document.getElementById("grid").innerHTML = visible().map(cardHTML).join("");
}

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(t=>
    `<div class="tab ${t.key===activeTab?"on":""}" data-key="${t.key}">${t.label}</div>`).join("");
  el.querySelectorAll(".tab").forEach(n=>n.addEventListener("click",()=>{
    activeTab = n.dataset.key; renderTabs(); render();
  }));
}
renderTabs(); render();
</script>
</body>
</html>
