<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLAR NETWORK · RarePop</title>
<style>
  :root{
    --bg0:#070b1d; --bg1:#101736;
    --ink:#e8efff; --dim:#8b96c9; --line:rgba(90,120,190,.3);
    --cyan:#46d6e6; --purple:#b78bff; --pink:#ff7bd5; --orange:#ffb347;
    --panel:rgba(13,20,44,.78);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 760px at 50% 35%,var(--bg1),var(--bg0) 75%);
    overflow:hidden;
  }
  .wrap{display:flex;flex-direction:column;height:100dvh;padding:14px 18px 16px;gap:12px}

  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:30px;height:30px;border:2px solid var(--cyan);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--cyan);font-weight:900}
  .brand h1{font-size:18px;font-weight:900;letter-spacing:3px}
  .brand h1 span{color:var(--cyan)}
  .hud{display:flex;gap:10px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--panel);font-size:12px;color:var(--dim);letter-spacing:1px}
  .chip b{color:var(--ink);font-weight:700}
  .chip .k{color:var(--cyan)}

  .scene{flex:1;position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,rgba(16,23,54,.2),rgba(7,11,29,.1))}
  svg{position:absolute;inset:0;width:100%;height:100%}
  #sky.shake{animation:skyShake .4s ease}
  @keyframes skyShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}

  .panel{
    display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;
    backdrop-filter:blur(12px);
    clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  }
  .q-left{display:flex;flex-direction:column;gap:8px;min-width:0}
  .q-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:6px}
  .q-text{font-size:19px;font-weight:700}
  .q-right{display:flex;gap:10px}
  input[type=text]{
    width:260px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;
    background:rgba(9,14,34,.85);color:var(--ink);font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;
  }
  input[type=text]:focus{border-color:var(--cyan)}
  button.launch{
    padding:13px 24px;border:1px solid var(--cyan);border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;
    font-family:inherit;color:#06222a;letter-spacing:1px;
    background:linear-gradient(135deg,#6fe6f2,#46d6e6);box-shadow:0 0 18px rgba(70,214,230,.35);
    transition:transform .12s,filter .12s;
  }
  button.launch:hover{filter:brightness(1.08)}
  button.launch:active{transform:translateY(2px)}
  button.launch:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:rgba(183,139,255,.12);border-color:var(--purple);color:#e6d9ff;box-shadow:none}
  .feedback{min-height:16px;font-size:13px;font-weight:700}
  .feedback.ok{color:#3ddc97}
  .feedback.err{color:#ff6b8a}
  .feedback.hint{color:#d9ccff;border-left:3px solid var(--purple);padding-left:8px}

  .badge.rarity1{background:rgba(159,180,200,.16);color:#9fb4c8}
  .badge.rarity2{background:rgba(90,168,255,.16);color:#5aa8ff}
  .badge.rarity3{background:rgba(183,139,255,.16);color:#b78bff}
  .badge.rarity4{background:rgba(255,179,71,.18);color:#ffb347;box-shadow:0 0 12px rgba(255,179,71,.35)}
  .badge.rarity5{background:rgba(255,209,102,.2);color:#ffd166;box-shadow:0 0 14px rgba(255,209,102,.45)}

  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,10,26,.7);backdrop-filter:blur(6px);z-index:20}
  .overlay.show{display:flex}

  .cyber{width:400px;background:rgba(10,16,38,.94);border:1px solid var(--cyan);border-radius:16px;padding:20px 22px;
    clip-path:polygon(0 16px,16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);
    box-shadow:0 0 30px rgba(70,214,230,.25)}
  .cyber-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--cyan);margin-bottom:16px}
  .cyber-head .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:blink 1s infinite}
  .cyber-list{list-style:none;display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
  .st{display:flex;align-items:center;gap:10px;font-size:14px;color:#cdd6f5}
  .st i{width:14px;height:14px;border-radius:50%;border:2px solid var(--cyan);flex:none;position:relative}
  .st.doing i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--cyan);animation:pulse .7s infinite}
  .st.done{color:#3ddc97}
  .st.done i{border-color:#3ddc97}
  .st.done i::after{content:"✓";position:absolute;inset:-3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#3ddc97;background:none}
  .cyber-bar{height:6px;border-radius:999px;background:rgba(70,214,230,.15);overflow:hidden}
  .cyber-bar div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:999px;transition:width .4s ease}
  #cyber-progress.waiting{animation:blink 1s infinite}

  .card{text-align:center;max-width:440px;padding:34px 30px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
  .card .big{font-size:28px;font-weight:900;margin:10px 0 6px}
  .card p{color:var(--dim);font-size:14px;line-height:1.6;margin-bottom:18px}
  .card .rank{font-size:12px;color:var(--pink);letter-spacing:2px}

  .arrive{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:340px;display:none;gap:16px;align-items:center;
    background:rgba(10,16,38,.94);border:1px solid #46d6e6;border-radius:16px;padding:18px 20px;z-index:12;
    clip-path:polygon(0 14px,14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
    box-shadow:0 0 26px rgba(70,214,230,.25)}
  .arrive.show{display:flex}
  .arrive.fail{border-color:#ff6b8a;box-shadow:0 0 26px rgba(255,107,138,.25)}
  .arrive-planet{width:60px;height:60px;flex:none}
  .arrive-planet svg{width:60px;height:60px;display:block;animation:wobble .9s ease-in-out 2}
  .arrive-info{flex:1;min-width:0}
  .arrive-name{font-size:19px;font-weight:900;color:#fff;margin-bottom:5px}
  .arrive-tag{display:inline-block;font-size:11px;color:#46d6e6;border:1px solid #46d6e6;border-radius:6px;padding:2px 8px;margin-bottom:8px}
  .arrive.fail .arrive-tag{color:#ff9db0;border-color:#ff6b8a}
  .arrive-desc{font-size:13px;color:#c3cbec;line-height:1.6}

  @keyframes blink{50%{opacity:.3}}
  @keyframes pulse{50%{transform:scale(.5)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}
  @keyframes pulseRing{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.15);opacity:.2}}
  @keyframes wobble{0%{transform:rotate(0)}20%{transform:rotate(-11deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}100%{transform:rotate(0)}}

  @media (max-width:860px){
    .panel{grid-template-columns:1fr}
    input[type=text]{width:100%}
    .q-right{flex-wrap:wrap}
    .arrive{width:min(320px,90vw)}
  }
  @media (max-height:430px){
    .wrap{padding:6px 8px 8px;gap:6px}
    header{gap:5px;flex-wrap:nowrap}
    .brand h1{display:none}
    .brand .logo{width:24px;height:24px;font-size:14px;border-radius:6px}
    .hud{gap:5px;flex-wrap:nowrap}
    .hud .chip:nth-child(2),.hud .chip:nth-child(5){display:none}
    .chip{font-size:8px;padding:3px 6px;border-radius:7px;letter-spacing:.5px}
    .scene{min-height:60px}
    .panel{padding:5px 7px;gap:5px;border-radius:10px}
    .q-left{gap:2px}
    .q-meta{font-size:8px;gap:5px}
    .q-text{font-size:12px;line-height:1.25}
    .feedback{font-size:9px;min-height:0}
    input[type=text]{padding:5px 7px;font-size:11px;border-radius:7px;width:auto;flex:1;min-width:0}
    button.launch{padding:5px 8px;font-size:10px;border-radius:7px}
    .q-right{gap:5px;flex-wrap:nowrap}
    .cyber{width:300px;padding:12px}
    .cyber-list{gap:8px;margin-bottom:12px}
    .st{font-size:11px}
    .arrive{width:auto;left:6px;right:6px;top:50%;transform:translateY(-50%);padding:6px 8px;gap:8px;border-radius:10px}
    .arrive-planet,.arrive-planet svg{width:26px;height:26px}
    .arrive-name{font-size:13px;margin-bottom:1px}
    .arrive-tag{font-size:8px;padding:0 4px;margin-bottom:2px}
    .arrive-desc{font-size:9px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">◈</div>
      <h1>SOLAR <span>NETWORK</span></h1>
    </div>
    <div class="hud">
      <div class="chip">TARGET <b id="hud-target">---</b></div>
      <div class="chip">LAST JUMP <b id="hud-last">0.00 AU</b></div>
      <div class="chip">TOTAL <b id="hud-total">0.00 AU</b></div>
      <div class="chip">JUMPS <b id="hud-reach">0</b></div>
      <div class="chip">FARTHEST <b id="hud-far">1</b></div>
    </div>
  </header>

  <div class="scene">
    <svg id="sky" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="nebPurple" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#7d4fd1" stop-opacity=".32"/>
          <stop offset="100%" stop-color="#7d4fd1" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="nebCyan" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2f9fb5" stop-opacity=".3"/>
          <stop offset="100%" stop-color="#2f9fb5" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="nebPink" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c94fa8" stop-opacity=".28"/>
          <stop offset="100%" stop-color="#c94fa8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff8e0"/>
          <stop offset="35%" stop-color="#ffd36b"/>
          <stop offset="100%" stop-color="#ff7a3d"/>
        </radialGradient>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="nebula"></g>
      <g id="grid"></g>
      <g id="bgstars"></g>
      <g id="orbits"></g>
      <g id="trails"></g>
      <g id="planets"></g>
      <g id="sun"></g>
      <g id="hit"></g>
      <g id="rocket"></g>
    </svg>

    <div class="overlay" id="cyber">
      <div class="cyber">
        <div class="cyber-head"><span class="dot"></span>SYSTEM // JUMP PREP</div>
        <ul class="cyber-list" id="cyber-list"></ul>
        <div class="cyber-bar"><div id="cyber-progress"></div></div>
      </div>
    </div>

    <div class="arrive" id="arrive">
      <div class="arrive-planet" id="arrive-planet">
        <svg viewBox="0 0 64 64" width="60" height="60">
          <circle cx="32" cy="32" r="26" fill="none" stroke="#46d6e6" stroke-width="1.5" opacity=".6"/>
          <circle class="body" cx="32" cy="32" r="20" fill="#8be9ff"/>
          <ellipse cx="26" cy="25" rx="7" ry="4.5" fill="#fff" opacity=".5"/>
        </svg>
      </div>
      <div class="arrive-info">
        <div class="arrive-name" id="arrive-name"></div>
        <div class="arrive-tag" id="arrive-tag"></div>
        <p class="arrive-desc" id="arrive-desc"></p>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="card">
        <div class="rank" id="rank-label">MISSION REPORT</div>
        <div class="big" id="rank-title"></div>
        <p id="rank-desc"></p>
        <button class="launch" id="btn-restart">FLY AGAIN</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="q-left">
      <div class="q-meta">
        <span class="badge rarity1" id="q-tier">LOCKING</span>
        <span>NEXT · <b id="q-target">---</b></span>
        <span id="q-dist"></span>
      </div>
      <div class="q-text" id="q-text"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="q-right">
      <input type="text" id="answer" placeholder="Type an answer…" autocomplete="off">
      <button class="launch ghost" id="btn-hint">HINT</button>
      <button class="launch" id="btn-launch">CONFIRM</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var CX = 560, CY = 340;
  var RINGS = [64, 104, 144, 184, 224, 264, 300, 336];
  var RING_DIST = ['NEAR 01','NEAR 02','MID 03','MID 04','FAR 05','FAR 06','DEEP 07','VOID 08'];
  var RING_TIER = ['EASY','EASY','NORMAL','NORMAL','HARD','HARD','EXPERT','EXPERT'];
  var RARITY = [
    null,
    { name: 'COMMON',    color: '#9fb4c8', rings: [0, 1], cls: 'rarity1' },
    { name: 'UNCOMMON',  color: '#5aa8ff', rings: [2, 3], cls: 'rarity2' },
    { name: 'RARE',      color: '#b78bff', rings: [4, 5], cls: 'rarity3' },
    { name: 'EPIC',      color: '#ffb347', rings: [6],    cls: 'rarity4' },
    { name: 'LEGENDARY', color: '#ffd166', rings: [7],    cls: 'rarity5' }
  ];
  var TIER_LEVEL = { common: 1, uncommon: 2, rare: 3, epic: 4, legendary: 5 };
  var MISSION = 10;
  var PREFIX = ['Neon','Velvet','Quantum','Static','Midnight','Chrome','Solar','Lunar','Echo','Nova','Crystal','Plasma'];
  var SUFFIX = ['Star','Nebula','Orbit','Drift','Signal','Halo','Comet','Bloom'];
  var COLORS = ['#ff9ec4','#c6e25e','#7bd8c2','#ffb347','#b78bff','#ffe066','#6aa8ff','#ff7bd5','#8be9ff','#ff8a6b'];
  var DESC_TYPE = ['gas giant','rocky desert','ice moon','coral ocean world','crystal jungle','lava asteroid','floating mossball','magnetic frontier'];
  var DESC_FEAT = ['low gravity; the locals drift on glowing spores','rare spores light up the upper atmosphere','days and nights swing wildly; moss covers the ground','meteor showers pass overhead and crystal ore floats in the air','the magnetic field is unstable and compasses fail','a coral forest hides under the ocean','the crust pulses into new hills every few hours','two coloured auroras cross the night sky'];

  var packs = null;
  var QUESTIONS = [];
  var PLANETS = [];
  var state = { current: 0, reached: new Set([0]), target: null, flying: false, finished: false, launching: false, totalAU: 0, lastAU: 0, jumps: 0, hintUsed: false, answer: null, cardTimer: null, cardToken: 0 };
  var rocket = null;
  var lastJudge = 0;
  var audio = null;

  function beep(freq, dur, type, vol, delay) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audio) audio = new Ctx();
      if (audio.state === 'suspended') audio.resume();
      var t0 = audio.currentTime + (delay || 0);
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol == null ? 0.03 : vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function norm(s) {
    return String(s || '').trim().toLowerCase().replace(/[\s,，。.!！?？&]/g, '');
  }
  function makeDesc() { return pick(DESC_TYPE) + '; ' + pick(DESC_FEAT) + '.'; }
  function fallbackLore(answer) {
    var base = String(answer).replace(/[^A-Za-z0-9' -]/g, '').split(/\s+/).slice(0, 2).join(' ');
    var h = 0;
    for (var i = 0; i < String(answer).length; i++) h = (h * 31 + String(answer).charCodeAt(i)) >>> 0;
    return { name: base + ' ' + SUFFIX[h % SUFFIX.length], desc: 'A small world assembled from ' + answer + ' trivia.' };
  }

  /* ---------- build the system ---------- */
  function genPlanets() {
    var used = new Set();
    var arr = [];
    RINGS.forEach(function (radius, ri) {
      var count = [5, 6, 7, 8, 8, 9, 9, 10][ri];
      for (var i = 0; i < count; i++) {
        var ang = rand(0, Math.PI * 2);
        var name;
        do { name = pick(PREFIX) + ' ' + pick(SUFFIX); } while (used.has(name));
        used.add(name);
        arr.push({
          name: name,
          ring: ri,
          radius: radius,
          distAU: +(0.6 * (ri + 1) + rand(0, 0.3)).toFixed(2),
          x: CX + radius * Math.cos(ang),
          y: CY + radius * Math.sin(ang) * 0.82,
          color: pick(COLORS),
          size: rand(4, 6),
          desc: makeDesc(),
          reached: false
        });
      }
    });
    arr[0].name = 'Earth';
    arr[0].color = '#3d8bfd';
    arr[0].isEarth = true;
    return arr;
  }

  function buildNebula() {
    var g = $('nebula'); g.innerHTML = '';
    [[170,150,210,'url(#nebPurple)'],[990,520,220,'url(#nebCyan)'],[1010,130,160,'url(#nebPink)'],[150,560,180,'url(#nebPurple)'],[600,640,170,'url(#nebCyan)']].forEach(function (n) {
      var e = document.createElementNS(NS, 'ellipse');
      e.setAttribute('cx', n[0]); e.setAttribute('cy', n[1]);
      e.setAttribute('rx', n[2]); e.setAttribute('ry', n[2] * 0.7);
      e.setAttribute('fill', n[3]); g.appendChild(e);
    });
  }
  function buildGrid() {
    var g = $('grid'); g.innerHTML = '';
    for (var x = 0; x <= 1200; x += 60) {
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', x); l.setAttribute('y1', 0); l.setAttribute('x2', x); l.setAttribute('y2', 700);
      l.setAttribute('stroke', '#2a3566'); l.setAttribute('stroke-width', .5); l.setAttribute('opacity', .3);
      g.appendChild(l);
    }
    for (var y = 0; y <= 700; y += 60) {
      var h = document.createElementNS(NS, 'line');
      h.setAttribute('x1', 0); h.setAttribute('y1', y); h.setAttribute('x2', 1200); h.setAttribute('y2', y);
      h.setAttribute('stroke', '#2a3566'); h.setAttribute('stroke-width', .5); h.setAttribute('opacity', .3);
      g.appendChild(h);
    }
  }
  function buildStars() {
    var g = $('bgstars'); g.innerHTML = '';
    for (var i = 0; i < 110; i++) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', Math.random() * 1200); c.setAttribute('cy', Math.random() * 700);
      c.setAttribute('r', rand(.6, 1.7)); c.setAttribute('fill', '#fff');
      c.setAttribute('opacity', rand(.15, .6).toFixed(2)); g.appendChild(c);
    }
  }
  function buildOrbits() {
    var g = $('orbits'); g.innerHTML = '';
    RINGS.forEach(function (r, ri) {
      var col = ri % 2 ? '#b78bff' : '#46d6e6';
      var c = document.createElementNS(NS, 'ellipse');
      c.setAttribute('cx', CX); c.setAttribute('cy', CY);
      c.setAttribute('rx', r); c.setAttribute('ry', r * 0.82);
      c.setAttribute('fill', 'none'); c.setAttribute('stroke', col);
      c.setAttribute('stroke-width', 1.3); c.setAttribute('stroke-dasharray', '6 9');
      c.setAttribute('opacity', .35); g.appendChild(c);
      for (var k = 0; k < 24; k++) {
        var ang = k / 24 * Math.PI * 2;
        var tx = CX + r * Math.cos(ang), ty = CY + r * 0.82 * Math.sin(ang);
        var main = k % 6 === 0;
        var t = document.createElementNS(NS, 'rect');
        var sz = main ? 3.2 : 1.8;
        t.setAttribute('x', tx - sz / 2); t.setAttribute('y', ty - sz / 2);
        t.setAttribute('width', sz); t.setAttribute('height', sz);
        t.setAttribute('fill', col); t.setAttribute('opacity', main ? .75 : .4); g.appendChild(t);
      }
    });
  }
  function drawPlanets() {
    var g = $('planets'); g.innerHTML = '';
    PLANETS.forEach(function (p, i) {
      var wrap = document.createElementNS(NS, 'g');

  function matchAnswer(v, q) {
    var n = norm(v);
    if (!n) return null;
    for (var i = 0; i < q.ans.length; i++) {
      var item = q.ans[i];
      if (norm(item.v) === n) return item;
      for (var j = 0; j < item.aliases.length; j++) {
        if (norm(item.aliases[j]) === n) return item;
      }
    }
    return null;
  }

  /* ---------- target / flight ---------- */
  function chooseTarget(rarity) {
    var left = PLANETS.map(function (_, i) { return i; }).filter(function (i) { return !PLANETS[i].reached; });
    if (!left.length) return null;
    var cands = left.filter(function (i) { return rarity.rings.indexOf(PLANETS[i].ring) !== -1; });
    if (!cands.length) cands = left;
    state.target = pick(cands);
    return PLANETS[state.target];
  }

    var cx = (sx + ex) / 2, cy = Math.min(sy, ey) - 60;
    var dur = 950, t0 = performance.now();
    function frame(t) {
      var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      var x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * cx + e * e * ex;
      var y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * cy + e * e * ey;
      var dx = 2 * (1 - e) * (cx - sx) + 2 * e * (ex - cx);
      var dy = 2 * (1 - e) * (cy - sy) + 2 * e * (ey - cy);
      placeRocket(x, y, Math.atan2(dy, dx) * 180 / Math.PI);
      var dot = document.createElementNS(NS, 'circle');

      dot.setAttribute('fill', '#46d6e6'); dot.setAttribute('opacity', .65);
      $('trails').appendChild(dot);
      if (k < 1) requestAnimationFrame(frame);
      else { state.flying = false; done && done(); }

      { min: 0, label: 'ORBIT ROOKIE', desc: 'Barely left Earth orbit. The ship is still warm.' },

    ];

    if (!state.cyber || state.cyber.flying || state.cyber.aborted || !state.cyber.planet) return;
    var seq = state.cyber;
    seq.flying = true;
    $('cyber').classList.remove('show');

    setTimeout(function () {
      if (!state || state.finished || state.cyber !== seq || seq.aborted) return;

    if (state.cyber) state.cyber.aborted = true;
    state.cyber = null;
    $('cyber').classList.remove('show');

    var seq = state.cyber;
    if (!seq || seq.aborted || seq.ready) { abortCyber(); showFailCard(text, reason); return; }
    var timer = setInterval(function () {
      if (!state || state.cyber !== seq) { clearInterval(timer); return; }
      if (seq.ready) {
        clearInterval(timer);
        abortCyber();
        showFailCard(text, reason);
      }
    }, 100);
  }

  function beginLaunch(planet) {
    var cy = $('cyber'), list = $('cyber-list'), bar = $('cyber-progress');
    $('btn-launch').disabled = true;
    $('btn-hint').disabled = true;
    cy.classList.add('show');
    list.innerHTML = ''; bar.style.width = '0%'; bar.classList.remove('waiting');
    var seq = state.cyber = { planet: planet || null, ready: false, flying: false, aborted: false };
    var steps = planet
      ? ['Charging the ship', 'Igniting engines', 'Locking target · ' + RING_DIST[planet.ring], 'Jumping to ring ' + (planet.ring + 1)]
      : ['Charging the ship', 'Igniting engines', 'Scanning coordinates', 'Locking jump vector'];
    var i = 0;
    function next() {
      if (!state || state.cyber !== seq || seq.aborted) return;
      if (i >= steps.length) {
        bar.style.width = '100%';
        seq.ready = true;
        if (seq.planet) startCyberFlight();
        else bar.classList.add('waiting');
        return;
      }
      var label = steps[i];
      if (i === 2 && seq.planet) label = 'Locking target · ' + RING_DIST[seq.planet.ring];
      if (i === 3 && seq.planet) label = 'Jumping to ring ' + (seq.planet.ring + 1);
      var li = document.createElement('li');
      li.className = 'st doing';
      li.innerHTML = '<i></i><span>' + label + '</span>';
      list.appendChild(li);
      bar.style.width = (i / steps.length * 100) + '%';
      beep(420 + i * 90, 0.05, 'sine', 0.018);
      setTimeout(function () {
        if (!state || state.cyber !== seq || seq.aborted) return;
        li.classList.remove('doing'); li.classList.add('done'); i++; next();
      }, 700);
    }
    next();
  }

  function askJudge(q, text) {
    return fetch('/api/rarepop/judge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ theme: q.theme, questionId: q.qid, answer: String(text).slice(0, 80) })
    }).then(function (r) {
      if (r.status === 429) return { rate: true };
      return r.ok ? r.json() : null;
    }).then(function (d) {
      if (!d || d.rate) return d;
      if (!d.match) return null;
      for (var i = 0; i < q.ans.length; i++) if (q.ans[i].v === d.match) return q.ans[i];
      return null;
    }).catch(function () { return null; });
  }

  function submit() {
    if (!state || state.flying || state.finished || state.launching) return;
    var text = $('answer').value;
    if (!String(text || '').trim()) {
      $('feedback').textContent = 'Type an answer first.';
      $('feedback').className = 'feedback err';
      return;
    }
    var q = state._q;
    var hit = matchAnswer(text, q);
    if (hit) return launch(hit);
    if (Date.now() - lastJudge < 1500) {
      $('feedback').textContent = 'Easy — one check at a time.';
      $('feedback').className = 'feedback err';
      return;
    }
    lastJudge = Date.now();
    state.launching = true;
    $('answer').disabled = true;
    $('btn-launch').disabled = true;
    $('btn-hint').disabled = true;
    $('feedback').textContent = '';
    $('feedback').className = 'feedback';
    beginLaunch(null);
    askJudge(q, text).then(function (found) {
      if (!state || state.finished) return;
      if (found && !found.rate) return launch(found, true);
      failAfterCyber(text, found && found.rate ? 'rate' : 'invalid');
    });
  }

  function launch(hit, cyberStarted) {
    var rarity = RARITY[hit.r];
    var p = chooseTarget(rarity);
    if (!p) { finish(); return; }
    state._hit = hit;
    state.launching = true;
    $('feedback').textContent = '';
    $('feedback').className = 'feedback';
    $('answer').disabled = true;
    $('q-tier').textContent = rarity.name;
    $('q-tier').className = 'badge ' + rarity.cls;
    $('q-target').textContent = p.name;
    $('q-dist').textContent = '· ' + RING_DIST[p.ring] + ' · ' + p.distAU.toFixed(2) + ' AU';
    $('hud-target').textContent = p.name;
    $('hud-last').textContent = p.distAU.toFixed(2) + ' AU';
    beep(320, 0.07, 'triangle', 0.025);
    if (cyberStarted) setCyberTarget(p);
    else beginLaunch(p);
  }

  function useHint() {
    if (!state || state.hintUsed || state.flying || state.finished || state.launching) return;
    state.hintUsed = true;
    $('btn-hint').disabled = true;
    $('feedback').textContent = '💡 ' + (state._q.hint || 'No hint for this prompt.');
    $('feedback').className = 'feedback hint';
    beep(880, 0.05, 'square', 0.02);
  }

  function restart() {
    if (state && state.cardTimer) clearTimeout(state.cardTimer);
    PLANETS = genPlanets();
    state = { current: 0, reached: new Set([0]), target: null, flying: false, finished: false, launching: false, totalAU: 0, lastAU: 0, jumps: 0, far: 0, hintUsed: false, answer: null, cardTimer: null, cardToken: 0, _hit: null };
    $('overlay').classList.remove('show');
    $('cyber').classList.remove('show');
    $('arrive').classList.remove('show');
    $('hit').innerHTML = '';
    $('trails').innerHTML = '';
    buildNebula(); buildGrid(); buildStars(); buildOrbits(); drawPlanets(); drawSun();
    var e0 = PLANETS[0];
    placeRocket(e0.x, e0.y - 18, 0);
    renderQuestion();
  }

  async function boot() {
    try {
      var res = await fetch('/rarepop/packs.json?v=1', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      packs = await res.json();
    } catch (e) {
      $('q-text').textContent = 'Could not load the question data.';
      $('feedback').textContent = 'Refresh the page or try again in a moment.';
      return;
    }
    buildQuestions();
    PLANETS = genPlanets();
    buildNebula(); buildGrid(); buildStars(); buildOrbits(); drawPlanets(); drawSun();
    rocket = buildRocket();
    var e0 = PLANETS[0];
    placeRocket(e0.x, e0.y - 18, 0);
    state.far = 0;
    renderQuestion();
    $('btn-launch').addEventListener('click', submit);
    $('btn-hint').addEventListener('click', useHint);
    $('btn-restart').addEventListener('click', restart);
    $('answer').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  }

  boot();
})();
</script>
</body>
</html>
