  html.dark{
    --bg:#0f1420; --card:#1b2230; --ink:#f3f5f9; --sub:#9aa4b8;
    --line:#2e3748; --line-strong:#5b667c; --accent-soft:#26235a;
    --cell:#232b3a; --cell-hover:#2d3749; --clue-bg:#232b3a; --panel:#161d2a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg-img) center/cover no-repeat fixed, var(--bg);
    color:var(--ink); min-height:100%; display:flex; justify-content:center; padding:26px 16px 56px;
  }
  body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(238,241,246,.80),rgba(238,241,246,.80));z-index:-1}
  html.dark body::before{background:linear-gradient(rgba(15,20,32,.86),rgba(15,20,32,.86))}
  .wrap{width:100%;max-width:960px;position:relative;z-index:1}

  /* ===== 顶栏 ===== */
  header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .logo{width:48px;height:48px;border-radius:14px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 20px rgba(79,70,229,.35)}
  .title h1{font-size:25px;font-weight:800;letter-spacing:.5px}

  .tool-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}

  /* ===== 菜单 ===== */
  .mode-section{margin-bottom:26px}

  .chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

  .level-preview{width:100%;aspect-ratio:1;display:grid;gap:2px;align-content:center;justify-content:center;background:var(--panel);border-radius:12px;padding:10px}

  /* ===== 游戏页 ===== */

  .seg button.active.paint{background:var(--black);color:#fff}

  .spacer{flex:1}
  .palette{display:inline-flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:5px 8px}

  .clue .n{line-height:1;opacity:.38;transition:opacity .12s,transform .12s}

  .clue.done{color:#b9c0cd}
  .clue.done .n{opacity:.5;text-decoration:line-through;transform:none}
  .clue.mega{background:linear-gradient(135deg,#ede9fe,#fae8ff);border-left:2px solid var(--accent-2);border-right:2px solid var(--accent-2)}
  .clue.mega .n{color:var(--accent-2);font-size:1.15em;opacity:1}

  .cell{background:var(--cell);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);touch-action:none}
  .cell:hover{background:var(--cell-hover)}
  .cell.cross::after{content:"✕";color:var(--mark);font-weight:800;line-height:1}
  .cell.wrong{outline:2px solid var(--mark);outline-offset:-2px}
  .cell.hint-pulse{animation:pulse 1.4s ease-in-out infinite}
  .cell.lit{animation:lit .35s ease}
  .b5-r{border-bottom:2px solid var(--line-strong) !important}
  .b5-c{border-right:2px solid var(--line-strong) !important}
  @keyframes pulse{0%,100%{box-shadow:inset 0 0 0 2px var(--accent)}50%{box-shadow:inset 0 0 0 4px var(--accent)}}
  @keyframes lit{0%{filter:brightness(1.6)}100%{filter:brightness(1)}}

  .toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.18)}

  /* 三角 */

  .trid-hints{display:flex;flex-direction:column;gap:12px;font-size:12.5px}
  .tri-group{display:flex;flex-direction:column;gap:4px}
  .tri-group .gh{font-weight:700;color:var(--sub);margin-bottom:2px}
  .tri-line{display:flex;gap:6px;align-items:center;color:var(--ink);font-variant-numeric:tabular-nums}
  .trid-container{margin:0 auto;width:fit-content}
  .trid-container svg{max-width:100%;height:auto;touch-action:none}
  .trid-container svg polygon{touch-action:none}

  /* 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(20,24,34,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(3px)}
  .overlay.show{display:flex}
  .modal{background:var(--card);border-radius:22px;padding:30px 26px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal .emoji{font-size:44px;margin-bottom:10px}
  .modal h2{font-size:21px;font-weight:800;margin-bottom:6px}

  .particle{position:fixed;pointer-events:none;border-radius:50%;animation:firework .9s ease-out forwards;z-index:9999}
  @keyframes firework{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}

  @media (max-width:560px){
    body{padding:16px 12px 40px}
    .title h1{font-size:19px}
    .title p{font-size:12px}
    .stats{gap:10px;padding:7px 10px;font-size:12px}
    .level-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .level-card{padding:10px;border-radius:15px;gap:8px}

    .toolbar{gap:8px}
    .seg button{padding:8px 11px;font-size:12px}
    .tool-btn{padding:9px 11px;font-size:12px}
    .swatch{width:24px;height:24px}
    .game-topbar{gap:8px}
    .puzzle-title{font-size:16px}
    .head-actions{gap:6px}
    .pill{padding:7px 11px;font-size:12px}
    .checks{gap:12px;font-size:12px}
    .board-shell{overflow-x:auto}
    .mega-row{gap:14px}
  }
  @media (max-width:380px){
    .level-grid{grid-template-columns:1fr}
  }
</style>

<body>
<div class="wrap">
  <header>
    <div class="logo">⬛</div>
    <div class="title">
      <h1>Nonogram Collection</h1>
      <p>Logic paint · reveal hidden pixel art</p>
    </div>
    <div class="head-actions">
      <span class="pill" id="progressPill">Solved <b>0</b>/<b>0</b> · ★ <b>0</b></span>
      <button class="tool-btn" id="btnDaily">📅 Daily</button>
      <button class="tool-btn" id="btnAlbum">📖 Album</button>
      <button class="tool-btn" id="btnDark">🌓</button>
      <button class="tool-btn" id="btnSetting">⚙</button>
    </div>
  </header>

  <!-- ============ 菜单视图 ============ -->
  <div id="viewMenu"></div>

  <!-- ============ 游戏视图 ============ -->
  <div id="viewGame" style="display:none">
    <div class="game-topbar">
      <button class="tool-btn" id="btnBack">← Menu</button>
      <div>
        <div class="puzzle-title" id="puzzleTitle">Puzzle</div>
      </div>
      <span class="mode-tag" id="modeTag"></span>
      <div class="spacer"></div>
      <div class="stats">
        <span>Time <b id="timer">00:00</b></span>
        <span>Errors <b id="errCount">0</b></span>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="seg" id="toolSeg">
          <button class="paint active" data-tool="paint">⬛ Paint</button>
          <button class="cross" data-tool="cross">✕ Mark</button>
        </div>
        <div class="palette" id="palette"></div>
        <div class="spacer"></div>
        <button class="tool-btn" id="btnUndo">↩ Undo</button>
        <button class="tool-btn" id="btnHint">💡 Hint</button>
        <button class="tool-btn" id="btnReset">⟲ Reset</button>
        <button class="tool-btn primary" id="btnNew">🎲 Random</button>
      </div>

      <div class="toolbar">
        <div class="checks">
          <label><input type="checkbox" id="chkHard"> Hardcore (no live error check)</label>
          <label><input type="checkbox" id="chkSound" checked> Sound</label>
        </div>
      </div>

      <div class="board-shell"><div id="boardWrap"></div></div>

      <p class="hint" id="ruleHint"></p>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 基础 ================= */
const $ = id => document.getElementById(id);
const COLORS = {
  K:'#1b2030', R:'#ef4444', G:'#22c55e', B:'#3b82f6',
  Y:'#f59e0b', P:'#a855f7', O:'#f97316', C:'#06b6d4'
};
const STORAGE_KEY = 'nono_collection_v2';

const MODES = [
  { key:'standard', name:'Classic', icon:'⬛', desc:'Traditional logic paint' },
  { key:'color',    name:'Color', icon:'🎨', desc:'Multi-color brushes · adjacent colors allowed' },
  { key:'clip',     name:'Clip', icon:'🧩', desc:'Assemble two fragments' },
  { key:'mega',     name:'Mega', icon:'🔢', desc:'Shared cross-row/col clues' },
  { key:'triddlers',name:'Triddlers', icon:'🔺', desc:'Three-direction diagonal logic' }
];

/* ================= 题库生成 ================= */
/* 黑白种子：5×5，# 填格，. 空；cat 为主题分类 */
const SEEDS = [
  { name:'Heart',      cat:'Symbols',  rows:['.#.#.','#####','#####','.###.','.....'] },
  { name:'Sailboat',   cat:'Objects',  rows:['..#..','.###.','#####','.###.','.###.'] },
  { name:'House',      cat:'Objects',  rows:['.###.','#####','#.#.#','#.#.#','..#..'] },
  { name:'Star',       cat:'Space',     rows:['..#..','#.#.#','#####','.###.','.#.#.'] },
  { name:'Mushroom',   cat:'Food',      rows:['.###.','#####','.###.','.###.','..#..'] },
  { name:'Tree',       cat:'Nature',   rows:['..#..','.###.','#####','..#..','..#..'] },
  { name:'Up Arrow',   cat:'Shapes',    rows:['..#..','.###.','..#..','..#..','..#..'] },
  { name:'Down Arrow',  cat:'Shapes',    rows:['..#..','..#..','..#..','.###.','..#..'] },
  { name:'Right Arrow',cat:'Shapes',    rows:['..#..','.##..','###..','.##..','..#..'] },
  { name:'Diamond',     cat:'Shapes',    rows:['..#..','.###.','#####','.###.','..#..'] },
  { name:'Cross',      cat:'Shapes',    rows:['..#..','..#..','#####','..#..','..#..'] },
  { name:'Fish',       cat:'Animals',   rows:['..##.','#.##.','###.#','#.##.','..##.'] },
  { name:'Apple',      cat:'Food',      rows:['..#..','.###.','##.#.','####.','.##..'] },
  { name:'Sun',        cat:'Space',     rows:['.#.#.','#####','#.#.#','.###.','.#.#.'] },
  { name:'Cloud',      cat:'Nature',   rows:['.....','.###.','#####','.###.','.....'] },
  { name:'Smile',      cat:'Symbols',  rows:['.###.','#.#.#','#####','#...#','.###.'] },
  { name:'Cup',        cat:'Objects',   rows:['###.#','#..##','#...#','#####','.....'] },
  { name:'Hat',        cat:'Objects',   rows:['.....','.###.','#####','.....','.....'] },
  { name:'Butterfly',  cat:'Animals',   rows:['#.#.#','###.#','#####','###.#','#.#.#'] },
  { name:'Moon',       cat:'Space',     rows:['..##.','.#...','#....','.#...','..##.'] }
];
/* 7×7 大尺寸种子（中难度） */
const LARGE7 = [
  { name:'Whale',     cat:'Animals', rows:['..###..','.#####.','#######','###.###','.##.##.','.......','.......'] },
  { name:'Castle',    cat:'Objects',  rows:['#.#.#.#','#######','#.#.#.#','#####.#','#...#.#','#...#.#','.......'] },
  { name:'Big Tree',  cat:'Nature',   rows:['...#...','..###..','.#####.','#######','..###..','..###..','..###..'] },
  { name:'Big Flower',cat:'Nature',   rows:['..#.#..','.##.##.','.#####.','..###..','..###..','.#####.','.......'] },
  { name:'Tall Arrow',cat:'Shapes',   rows:['...#...','..###..','.#####.','...#...','...#...','...#...','...#...'] }
];
/* 彩色种子：行内字母即颜色 key，. 空 */
const COLOR_SEEDS = [
  { name:'Flower',      cat:'Nature',   rows:['.RR.','RYRYR','.RRR.','..G..','.GGG.'] },
  { name:'Balloon',     cat:'Objects',  rows:['.PP..','PPPP.','.PP..','..O..','.OO..'] },
  { name:'Rainbow',     cat:'Nature',   rows:['RR.OO','YY.GG','.BBB.','.....','.....'] },
  { name:'Bird',        cat:'Animals',  rows:['RRGG.','RYYG.','.BB..','..B..','.....'] },
  { name:'Tropical Fish',cat:'Animals', rows:['BBG..','BGGG.','BBG..','.....','.....'] },
  { name:'Tulip',       cat:'Nature',   rows:['.R.R.','.RRR.','..R..','..G..','.GGG.'] }
];
const COLOR_SEQ = ['R','G','B','Y','P','O'];
const CATS = ['Animals','Space','Nature','Food','Objects','Shapes','Symbols'];

function seedGrid(rows){ return rows.map(r=>r.split('').map(ch=>ch==='#'?'K':0)); }
function mirrorH(g){ return g.map(row=>row.slice().reverse()); }
function mirrorV(g){ return g.slice().reverse(); }
function rot180(g){ return mirrorV(mirrorH(g)); }
function colorize(g, seq){
  let k=0;
  return g.map(row=>row.map(v=>{ if(!v) return 0; const c=seq[k%seq.length]; k++; return c; }));
}
function colorSeedGrid(rows){
  return rows.map(row=>row.split('').map(ch=>COLORS[ch]?ch:0));
}
/* 最近邻放大：把小图放大 k 倍，用于 10×10 难题 */
function upscale(g,k){
  const h=g.length,w=g[0].length,out=[];
  for(let r=0;r<h;r++){
    const band=Array.from({length:k},()=>[]);
    for(let c=0;c<w;c++){
      const v=g[r][c];
      for(let i=0;i<k;i++) for(let j=0;j<k;j++) band[i].push(v);
    }
    band.forEach(row=>out.push(row));
  }
  return out;
}

const PUZZLES = { standard:[], color:[], clip:[], mega:[], triddlers:[] };
const pid = (mode,n)=>`${mode[0]}${n}`;

/* Classic：种子 + 镜像/倒影变体（40）+ 7×7 大包（5）+ 10×10 放大难题（4） */
SEEDS.forEach(s=>{
  const g=seedGrid(s.rows);
  PUZZLES.standard.push({ id:pid('s',PUZZLES.standard.length+1), name:s.name, cat:s.cat, grid:g });
  PUZZLES.standard.push({ id:pid('s',PUZZLES.standard.length+1), name:`${s.name} Mirror`, cat:s.cat, grid:mirrorH(g) });
  PUZZLES.standard.push({ id:pid('s',PUZZLES.standard.length+1), name:`${s.name} Flip`, cat:s.cat, grid:mirrorV(g) });
});
PUZZLES.standard = PUZZLES.standard.slice(0,40);
LARGE7.forEach(s=>{
  PUZZLES.standard.push({ id:pid('s',PUZZLES.standard.length+1), name:`${s.name} (L)`, cat:s.cat, grid:seedGrid(s.rows) });
});
[1,3,11,19].forEach(idx=>{
  const s=SEEDS[idx], g=upscale(seedGrid(s.rows),2);
  PUZZLES.standard.push({ id:pid('s',PUZZLES.standard.length+1), name:`${s.name} (XL)`, cat:s.cat, grid:g });
});

/* Color：手写彩图 + 黑白种子套配色（25） */
COLOR_SEEDS.forEach(cs=>{
  PUZZLES.color.push({ id:pid('c',PUZZLES.color.length+1), name:cs.name, cat:cs.cat, grid:colorSeedGrid(cs.rows) });
});
SEEDS.forEach((s,i)=>{
  const g=colorize(seedGrid(s.rows), COLOR_SEQ.slice(i%3).concat(COLOR_SEQ.slice(0,i%3)));
  PUZZLES.color.push({ id:pid('c',PUZZLES.color.length+1), name:`${s.name} Color`, cat:s.cat, grid:g });
});
PUZZLES.color = PUZZLES.color.slice(0,25);

/* Clip：两两配对，15 对 */
for(let i=0;i<15;i++){
  const a=SEEDS[i%SEEDS.length], b=SEEDS[(i+1)%SEEDS.length];
  PUZZLES.clip.push({
    id:pid('p',i+1), name:`${a.name} & ${b.name}`, cat:a.cat,
    blocks:[{ grid:seedGrid(a.rows) },{ grid:seedGrid(b.rows) }]
  });
}

/* Mega：前 10 个种子，前两行 / 中间两列共用线索 */
for(let i=0;i<10;i++){
  const s=SEEDS[i];
  PUZZLES.mega.push({
    id:pid('m',i+1), name:s.name, cat:s.cat,
    megaRows:[[0,1]], megaCols:[[2,3]], grid:seedGrid(s.rows)
  });
}

/* Triddlers：前 10 个种子裁上三角 */
for(let i=0;i<10;i++){
  const g=seedGrid(SEEDS[i].rows);
  const cells=g.map((row,r)=>row.slice(0,r+1).map(v=>v?1:0));
  PUZZLES.triddlers.push({ id:pid('t',i+1), name:SEEDS[i].name, cat:SEEDS[i].cat, size:g.length, cells });
}

/* ================= 存档 ================= */
let save = { album:{}, settings:{ sound:true, hard:false, dark:false } };
try{ const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); if(raw) save = Object.assign(save, raw); }catch(e){}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(save)); }
function totalPuzzles(){ return Object.values(PUZZLES).reduce((a,lib)=>a+lib.length,0); }
function totalStars(){ return Object.values(save.album).reduce((a,r)=>a+r.star,0); }

/* ================= 状态 ================= */
const state = {
  view:'menu', mode:'standard', filterMode:'all', puzzle:null, puzzleId:'',
  blocks:[], tri:null, palette:['K'], curColor:'K',
  tool:'paint', history:[], seconds:0, timerId:null, started:false, solved:false,
  errors:0, dragValue:null, errSet:new Set()
};

/* ================= 音效 ================= */
let audioCtx = null;
function tone(freq=520, dur=0.07, type='sine'){
  if(!save.settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

let toastTimer=null;
function toast(msg){
  const el=$('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ================= 线索 ================= */
function lineClues(line){
  const out=[]; let cur=null, n=0;
  for(const v of line){
    if(v && v!==2){
      if(v===cur) n++;
      else { if(cur) out.push({n,c:cur}); cur=v; n=1; }
    } else {
      if(cur){ out.push({n,c:cur}); cur=null; n=0; }
    }
  }
  if(cur) out.push({n,c:cur});
  return out.length ? out : [{n:0,c:null}];
}
const sig = line => JSON.stringify(lineClues(line));

/* ================= 计时 ================= */
function fmt(s){ return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function startTimer(){
  if(state.started) return;
  state.started=true;
  state.timerId=setInterval(()=>{ state.seconds++; $('timer').textContent=fmt(state.seconds); },1000);
}
function stopTimer(){ clearInterval(state.timerId); }

/* ================= 题库装载 ================= */
function paletteOf(puzzle){
  const set=new Set();
  const list=puzzle.blocks||[puzzle];
  list.forEach(b=>b.grid.forEach(row=>row.forEach(v=>{ if(v&&v!==2) set.add(v); })));
  return [...set];
}
function startPuzzle(mode, puzzle){
  state.mode=mode; state.puzzle=puzzle; state.puzzleId=puzzle.id;
  stopTimer();
  if(mode==='triddlers'){
    state.tri={ solution:puzzle.cells.map(r=>r.slice()), grid:puzzle.cells.map(r=>r.map(()=>0)) };
    state.blocks=[];
  } else {
    state.tri=null;
    state.blocks=(puzzle.blocks||[puzzle]).map(b=>({ solution:b.grid, grid:b.grid.map(row=>row.map(()=>0)) }));
    state.palette=paletteOf(puzzle);
    state.curColor=state.palette[0]||'K';
  }
  state.history=[]; state.errSet=new Set();
  state.seconds=0; state.started=false; state.solved=false; state.errors=0;
  $('timer').textContent='00:00'; $('errCount').textContent='0';
  $('btnUndo').disabled=true;
  $('overlay').classList.remove('show');
  // 视图切换
  state.view='game';
  $('viewMenu').style.display='none';
  $('viewGame').style.display='block';
  $('puzzleTitle').textContent=puzzle.name;
  $('modeTag').textContent=MODES.find(m=>m.key===mode).name;
  $('ruleHint').textContent = RULE_HINT[mode];
  render();
}

const RULE_HINT = {
  standard:'Click to paint / mark, right-click to cross out, drag to paint continuously. Numbers are the lengths of consecutive filled runs.',
  color:'Pick a brush color, then paint. Different colors may touch; two runs of the same color need a gap. Clue color matches the block color; matching clues highlight with your brush.',
  clip:'Solve each fragment separately. Complete both to reveal the full picture.',
  mega:'Purple large clues are shared across two adjacent rows (or columns); those cells are filled together.',
  triddlers:'The triangle board has three logic directions: horizontal, down-left diagonal, down-right diagonal. Click to fill / cross out and reveal the pattern.'
};

/* ================= 菜单渲染 ================= */
function miniPreview(grid, bare){
  const wrap=document.createElement('div');
  wrap.className=bare?'pv-grid':'level-preview';
  const h=grid.length, w=grid[0].length;
  wrap.style.gridTemplateColumns = bare ? `repeat(${w},11px)` : `repeat(${w},1fr)`;
  for(let r=0;r<h;r++) for(let c=0;c<w;c++){
    const cell=document.createElement('div'); cell.className='pv-cell';
    const v=grid[r][c];
    if(!bare) cell.style.aspectRatio='1';
    if(v&&v!==2) cell.style.background=COLORS[v]; else cell.style.background='transparent';
    wrap.appendChild(cell);
  }
  return wrap;
}
function cardPreview(puzzle){
  if(puzzle.blocks){
    const wrap=document.createElement('div'); wrap.className='level-preview';
    wrap.style.flexDirection='row'; wrap.style.gap='8px'; wrap.style.alignItems='center';
    puzzle.blocks.forEach(b=>wrap.appendChild(miniPreview(b.grid,true)));
    return wrap;
  }
  if(puzzle.cells){
    const wrap=document.createElement('div'); wrap.className='level-preview';
    const size=puzzle.size; wrap.style.gridTemplateColumns=`repeat(${size},1fr)`;
    for(let r=0;r<size;r++) for(let c=0;c<=r;c++){
      const cell=document.createElement('div'); cell.className='pv-cell';
      cell.style.aspectRatio='1';
      if(puzzle.cells[r][c]) cell.style.background=COLORS.K; else cell.style.background='transparent';
      wrap.appendChild(cell);
    }
    return wrap;
  }
  return miniPreview(puzzle.grid);
}

function allPuzzles(){
  const arr=[];
  Object.keys(PUZZLES).forEach(mode=>PUZZLES[mode].forEach(p=>arr.push({mode,p})));
  return arr;
}
function renderMenu(){
  const menu=$('viewMenu'); menu.innerHTML='';
  const done=Object.keys(save.album).length;
  $('progressPill').innerHTML=`Solved <b>${done}</b>/<b>${totalPuzzles()}</b> · ★ <b>${totalStars()}</b>`;

  // 模式筛选 chips
  const chips=el('div','filter-row');
  const all=[{key:'all',name:'All',icon:'🎮'},...MODES];
  all.forEach(m=>{
    const chip=el('button','chip'+(state.filterMode===m.key?' active':''), `${m.icon||''} ${m.name}`);
    chip.onclick=()=>{ state.filterMode=m.key; tone(600,0.05); renderMenu(); };
    chips.appendChild(chip);
  });
  menu.appendChild(chips);

  const items=allPuzzles().filter(x=>state.filterMode==='all'||x.mode===state.filterMode);
  CATS.forEach(cat=>{
    const list=items.filter(x=>(x.p.cat||'Other')===cat);
    if(!list.length) return;
    const sec=el('div','mode-section');
    const head=el('div','mode-head');
    head.innerHTML=`<h2>${cat}</h2><span>${list.length} puzzles</span>`;
    sec.appendChild(head);
    const grid=el('div','level-grid');
    list.forEach(({mode,p})=>{
      const rec=save.album[p.id];
      const modeName=MODES.find(m=>m.key===mode).name;
      const card=document.createElement('div'); card.className='level-card';
      card.appendChild(cardPreview(p));

      tags.appendChild(el('span','card-mode',modeName));
      card.appendChild(tags);

      const meta=document.createElement('div'); meta.className='level-meta';
      meta.innerHTML = rec
        ? `<span class="stars">${'★'.repeat(rec.star)}${'☆'.repeat(3-rec.star)}</span><span>${fmt(rec.time)}</span>`
        : `<span class="stars">☆☆☆</span><span>Unsolved</span>`;
      card.appendChild(meta);
      card.onclick=()=>{ tone(600,0.06); startPuzzle(mode,p); };
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    menu.appendChild(sec);
  });
}

/* ================= 渲染：方块棋盘 ================= */
function metrics(w){
  let m;
  if(w<=5)  m={cell:44,clueW:76,clueH:46,fs:14};
  else if(w<=10) m={cell:34,clueW:62,clueH:40,fs:12};
  else m={cell:26,clueW:54,clueH:34,fs:11};
  const wrap=document.querySelector('.wrap');
  const avail=(wrap?wrap.clientWidth:window.innerWidth)-24;
  const boardW=m.clueW+w*m.cell;
  if(boardW>avail){
    const fitCell=Math.max(16,Math.floor((avail-m.clueW)/w));
    const scale=fitCell/m.cell;
    m.cell=fitCell;
    m.clueW=Math.max(38,Math.floor(m.clueW*scale));
    m.clueH=Math.max(30,Math.floor(m.clueH*scale));
    m.fs=Math.max(10,m.fs-1);
  }
  return m;
}
function el(tag,cls,text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!==undefined)e.textContent=text; return e; }
function clueHTML(clue){
  return clue.map(x=>`<span class="n" data-c="${x.c||''}" style="color:${x.c?COLORS[x.c]:'var(--ink)'}">${x.n}</span>`).join('');
}

function renderBlock(block, bi){
  const h=block.solution.length, w=block.solution[0].length;
  const m=metrics(w);
  const board=el('div','board');
  board.style.gridTemplateColumns=`${m.clueW}px repeat(${w}, ${m.cell}px)`;
  board.style.gridTemplateRows=`${m.clueH}px repeat(${h}, ${m.cell}px)`;
  board.style.fontSize=m.fs+'px';

  const corner=el('div','corner');
  corner.style.gridColumn='1'; corner.style.gridRow='1';
  board.appendChild(corner);

  const colClues=[];
  for(let c=0;c<w;c++) colClues.push(lineClues(block.solution.map(row=>row[c])));
  const rowClues=block.solution.map(row=>lineClues(row));

  const mega = state.mode==='mega' ? state.puzzle : null;
  const rowMega = mega ? new Set((mega.megaRows||[]).map(p=>p[0])) : new Set();
  const colMega = mega ? new Set((mega.megaCols||[]).map(p=>p[0])) : new Set();

  for(let c=0;c<w;c++){
    const clue=el('div','clue col'+(colMega.has(c)?' mega':''));
    clue.style.gridColumn=(c+2); clue.style.gridRow='1'; clue.dataset.c=c;
    clue.innerHTML=clueHTML(colClues[c]);
    board.appendChild(clue);
  }
  for(let r=0;r<h;r++){
    const isPair=(mega&&mega.megaRows||[]).some(p=>p[0]===r||p[1]===r);
    const clue=el('div','clue row'+(isPair?' mega':''));
    clue.style.gridRow=(r+2);
    clue.dataset.r=r;
    clue.innerHTML=clueHTML(rowClues[r]);
    board.appendChild(clue);
  }
  for(let r=0;r<h;r++){
    for(let c=0;c<w;c++){
      const cellEl=el('div','cell');
      cellEl.style.gridColumn=(c+2); cellEl.style.gridRow=(r+2);
      cellEl.dataset.b=bi; cellEl.dataset.r=r; cellEl.dataset.c=c;
      if((r+1)%5===0) cellEl.classList.add('b5-r');
      if((c+1)%5===0) cellEl.classList.add('b5-c');
      applyCell(cellEl,bi,block,r,c);
      bindCell(cellEl,board);
      board.appendChild(cellEl);
    }
  }
  bindBoardDrag(board);
  return board;
}

function applyCell(cellEl,bi,block,r,c){
  const v=block.grid[r][c];
  cellEl.classList.toggle('cross',v===2);
  cellEl.classList.toggle('wrong',state.errSet.has(`${bi},${r},${c}`));
  if(v&&v!==2){ cellEl.style.background=COLORS[v]; } else { cellEl.style.background=''; }
}

function render(){
  const wrap=$('boardWrap'); wrap.innerHTML='';
  if(state.mode==='triddlers'){ renderTriddlers(wrap); return; }

  const holder=el('div','mega-row');
  state.blocks.forEach((block,bi)=>{
    const col=el('div','block-col');
    if(state.blocks.length>1) col.appendChild(el('div','block-title',`Block ${bi+1}`));
    col.appendChild(renderBlock(block,bi));
    holder.appendChild(col);
  });
  wrap.appendChild(holder);
  renderPalette();
  refreshClueState();
}

function renderPalette(){
  const pal=$('palette'); pal.innerHTML='';
  if(state.mode==='triddlers') return;
  state.palette.forEach(key=>{
    const sw=el('div','swatch'+(key===state.curColor?' active':''));
    sw.style.background=COLORS[key]; sw.dataset.color=key; sw.title=key;
    sw.onclick=()=>{ state.curColor=key; state.tool='paint'; syncToolSeg(); renderPalette(); refreshClueHighlight(); tone(600,0.05); };
    pal.appendChild(sw);
  });
}

function refreshClueState(){
  document.querySelectorAll('.block-col').forEach((col,bi)=>{
    const block=state.blocks[bi]; if(!block) return;
    col.querySelectorAll('.clue.row').forEach(cl=>{
      const r=+cl.dataset.r;
      cl.classList.toggle('done',sig(block.grid[r])===sig(block.solution[r]));
    });
    col.querySelectorAll('.clue.col').forEach(cl=>{
      const c=+cl.dataset.c;
      cl.classList.toggle('done',sig(block.grid.map(row=>row[c]))===sig(block.solution.map(row=>row[c])));
    });
  });
  refreshClueHighlight();
}
function refreshClueHighlight(){
  const active=state.tool==='paint'?state.curColor:null;
  document.querySelectorAll('.clue .n').forEach(sp=>{
    sp.classList.toggle('on',!!active && sp.dataset.c===active);
  });
}

/* ================= 方块交互 ================= */
function paintFromPoint(x,y){
  const el=document.elementFromPoint(x,y);
  const cell=el&&el.closest('.cell');
  if(!cell||state.dragValue===null) return;
  setCell(+cell.dataset.b,+cell.dataset.r,+cell.dataset.c,state.dragValue);
}
function bindCell(cellEl, board){
  cellEl.addEventListener('pointerdown',e=>{
    if(state.solved) return;
    e.preventDefault(); startTimer();
    const bi=+cellEl.dataset.b, r=+cellEl.dataset.r, c=+cellEl.dataset.c;
    pushUndo();
    const useCross=(e.button===2)||state.tool==='cross';
    const block=state.blocks[bi];
    const cur=block.grid[r][c];
    const next=useCross?(cur===2?0:2):(cur===state.curColor?0:state.curColor);
    state.dragValue=next;
    setCell(bi,r,c,next);
    try{ board.setPointerCapture(e.pointerId); }catch(_){}
  });
  cellEl.addEventListener('pointerenter',()=>{
    if(state.solved||state.dragValue===null) return;
    const bi=+cellEl.dataset.b, r=+cellEl.dataset.r, c=+cellEl.dataset.c;
    setCell(bi,r,c,state.dragValue);
  });
  cellEl.addEventListener('contextmenu',e=>e.preventDefault());
}
function bindBoardDrag(board){
  board.addEventListener('pointermove',e=>{
    if(state.dragValue===null) return;
    e.preventDefault();
    paintFromPoint(e.clientX,e.clientY);
  });
  const end=()=>{ state.dragValue=null; };
  board.addEventListener('pointerup',end);
  board.addEventListener('pointercancel',end);
}
function setCell(bi,r,c,v){
  const block=state.blocks[bi];
  if(block.grid[r][c]===v) return;
  block.grid[r][c]=v;
  state.errSet.delete(`${bi},${r},${c}`);
  const cellEl=document.querySelector(`.cell[data-b="${bi}"][data-r="${r}"][data-c="${c}"]`);
  if(cellEl) applyCell(cellEl,bi,block,r,c);
  if(!save.settings.hard) checkCell(bi,r,c);
  refreshClueState(); checkWin();
}
function checkCell(bi,r,c){
  const block=state.blocks[bi];
  const ans=block.solution[r][c], us=block.grid[r][c];
  if(us!==0&&us!==2&&us!==ans) state.errSet.add(`${bi},${r},${c}`);
  let wrong=0;
  state.blocks.forEach(b=>b.grid.forEach((row,ri)=>row.forEach((v,ci)=>{
    if(v!==0&&v!==2&&v!==b.solution[ri][ci]) wrong++;
  })));
  state.errors=wrong; $('errCount').textContent=wrong;
  const cellEl=document.querySelector(`.cell[data-b="${bi}"][data-r="${r}"][data-c="${c}"]`);
  if(cellEl) applyCell(cellEl,bi,block,r,c);
}
function pushUndo(){
  state.history.push(state.blocks.map(b=>b.grid.map(row=>row.slice())));
  if(state.history.length>200) state.history.shift();
  $('btnUndo').disabled=false;
}
function undo(){
  if(!state.history.length) return;
  state.blocks.forEach((b,i)=>b.grid=state.history.pop()[i]);
  state.errSet.clear();
  $('btnUndo').disabled=!state.history.length;
  tone(330,0.06); render();
}

/* ================= 方块判定 ================= */
function blockSolved(block){
  for(let r=0;r<block.solution.length;r++)
    for(let c=0;c<block.solution[0].length;c++){
      const ans=block.solution[r][c], us=block.grid[r][c];
      const ansF=ans!==0, usF=us!==0&&us!==2;
      if(ansF!==usF) return false;
      if(ansF&&us!==ans) return false;
    }
  return true;
}
function checkWin(){
  if(state.solved) return;
  const ok = state.mode==='triddlers' ? triSolved() : state.blocks.every(blockSolved);
  if(!ok) return;
  state.solved=true; stopTimer();
  const star=state.errors===0?3:state.errors<=2?2:1;
  save.album[state.puzzleId]={star,time:state.seconds,name:state.puzzle.name};
  saveData(); firework(); tone(880,0.2,'triangle');
  setTimeout(showWin,250);
}

/* ================= 三角 Triddlers ================= */
function triLines(size){
  const H=[],D1=[],D2=[];
  for(let r=0;r<size;r++) H.push(Array.from({length:r+1},(_,c)=>[r,c]));
  for(let c=0;c<size;c++) D1.push(Array.from({length:size-c},(_,k)=>[k+c,c]));
  for(let d=0;d<size;d++){ const arr=[]; for(let c=0;c<size-d;c++) arr.push([c+d,c]); D2.push(arr); }
  return {H,D1,D2};
}
function triSolved(){
  const t=state.tri;
  for(let r=0;r<t.solution.length;r++)
    for(let c=0;c<t.solution[r].length;c++){
      const ans=t.solution[r][c], us=t.grid[r][c];
      if((ans===1)!==(us===1)) return false;
    }
  return true;
}
function renderTriddlers(wrap){
  const t=state.tri, size=t.solution.length;
  const lines=triLines(size);
  const container=el('div','trid-wrap');

  // SVG 三角盘
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','360'); svg.setAttribute('height','300'); svg.setAttribute('viewBox','0 0 360 300');
  const s=46;
  for(let r=0;r<size;r++){
    for(let c=0;c<=r;c++){
      const x0=180-r*s*0.5+c*s, y0=30+r*s*0.866;
      const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      poly.setAttribute('points',`${x0},${y0} ${x0+s},${y0} ${x0+s/2},${y0+s*0.866}`);
      poly.dataset.r=r; poly.dataset.c=c;
      paintTri(poly,r,c);
      poly.style.cursor='pointer';
      poly.addEventListener('pointerdown',e=>{
        e.preventDefault(); if(state.solved) return; startTimer(); pushUndo();
        const cur=t.grid[r][c];
        const next=state.tool==='cross'?(cur===2?0:2):(cur===1?0:1);
        t.grid[r][c]=next; paintTri(poly,r,c); tone(520,0.05); refreshTriHints(); checkWin();
      });
      poly.addEventListener('contextmenu',e=>e.preventDefault());
      svg.appendChild(poly);
    }
  }
  const tc=el('div','trid-container'); tc.appendChild(svg); container.appendChild(tc);

  // 三向线索（按谜底生成，固定显示）
  const hints=el('div','trid-hints');
  hints.id='triHints';
  hints.appendChild(triGroup('Horizontal H',lines.H,t.solution));
  hints.appendChild(triGroup('Diagonal ↘',lines.D1,t.solution));
  hints.appendChild(triGroup('Diagonal ↙',lines.D2,t.solution));
  container.appendChild(hints);
  wrap.appendChild(container);
}
function paintTri(poly,r,c){
  const v=state.tri.grid[r][c];
  poly.setAttribute('fill', v===1?'var(--black)':v===2?'#fde2e6':'var(--cell)');
  poly.setAttribute('stroke','var(--line-strong)');
}
function triGroup(title, lines, source){
  const g=el('div','tri-group');
  g.appendChild(el('div','gh',title));
  lines.forEach(line=>{
    const vals=line.map(([r,c])=>source[r][c]);
    g.appendChild(el('div','tri-line',lineClues(vals).map(x=>x.n).join(' ')||'·'));
  });
  return g;
}
function refreshTriHints(){ /* 三角线索按谜底固定，无需随涂改变更 */ }

/* ================= 提示 ================= */
function doHint(){
  if(state.solved) return;
  if(state.mode==='triddlers'){
    const t=state.tri;
    for(let r=0;r<t.solution.length;r++) for(let c=0;c<t.solution[r].length;c++){
      if(t.solution[r][c]===1 && t.grid[r][c]!==1){
        const p=document.querySelector(`polygon[data-r="${r}"][data-c="${c}"]`);
        if(p){ p.classList.add('hint-pulse'); setTimeout(()=>p.classList.remove('hint-pulse'),1500); }
        tone(660,0.1);
        return;
      }
    }
    return;
  }
  for(let bi=0;bi<state.blocks.length;bi++){
    const block=state.blocks[bi];
    for(let r=0;r<block.solution.length;r++) for(let c=0;c<block.solution[0].length;c++){
      const ans=block.solution[r][c], us=block.grid[r][c];
      if(ans!==0&&us!==ans){
        const elc=document.querySelector(`.cell[data-b="${bi}"][data-r="${r}"][data-c="${c}"]`);
        if(elc){ elc.classList.add('hint-pulse'); setTimeout(()=>elc.classList.remove('hint-pulse'),1500); }
        tone(660,0.1);
        return;
      }
    }
  }
  toast('No more hints available.');
}

/* ================= 重置 / 换关 ================= */
function resetBoard(){
  if(state.solved) return;
  pushUndo();
  if(state.mode==='triddlers'){
    state.tri.grid=state.tri.grid.map(r=>r.map(()=>0));
  } else {
    state.blocks.forEach(b=>b.grid=b.grid.map(row=>row.map(()=>0)));
  }
  state.errSet.clear(); state.errors=0; $('errCount').textContent=0;
  render();
}
function randomOther(){
  const lib=PUZZLES[state.mode];
  if(!lib.length) return;
  let p; do{ p=lib[Math.floor(Math.random()*lib.length)]; }while(lib.length>1&&p.id===state.puzzleId);
  startPuzzle(state.mode,p);
}

/* ================= 礼花 ================= */
function firework(){
  const colors=['#ef4444','#22c55e','#4f46e5','#fbbf24','#ec4899','#06b6d4'];
  for(let i=0;i<60;i++){
    const p=document.createElement('div'); p.className='particle';
    p.style.left=window.innerWidth/2+'px'; p.style.top=window.innerHeight/2+'px';
    p.style.setProperty('--dx',(Math.random()-0.5)*340+'px');
    p.style.setProperty('--dy',(Math.random()-0.5)*340+'px');
    p.style.width=p.style.height=(6+Math.random()*6)+'px';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(p); setTimeout(()=>p.remove(),900);
  }
}

/* ================= 弹窗 ================= */
function showWin(){
  const star=state.errors===0?3:state.errors<=2?2:1;
  const lib=PUZZLES[state.mode];
  const idx=lib.findIndex(p=>p.id===state.puzzleId);
  const next=lib[idx+1];
  $('modalBody').innerHTML=`
    <div class="emoji">🎉</div>
    <h2>Solved! ${state.puzzle.name}</h2>
    <p class="stars" style="font-size:22px">${'★'.repeat(star)}${'☆'.repeat(3-star)}</p>
    <p>Time ${fmt(state.seconds)} ｜ Errors ${state.errors}</p>
    <div class="row">
      <button class="tool-btn" onclick="closeModal();backToMenu()">Menu</button>
      <button class="tool-btn" onclick="closeModal();startPuzzle(state.mode, state.puzzle)">Replay</button>
      ${next?`<button class="tool-btn primary" onclick="closeModal();startPuzzle('${state.mode}', PUZZLES['${state.mode}'][${idx+1}])">Next →</button>`:''}
    </div>`;
  $('overlay').classList.add('show');
}
function showAlbum(){
  let html=`<h2 style="font-size:20px;font-weight:800;margin-bottom:12px">📖 Album</h2>`;
  const keys=Object.keys(save.album);
  if(!keys.length) html+=`<p>No puzzles solved yet. Unlock your first picture!</p>`;
  else keys.forEach(id=>{
    const rec=save.album[id];
    html+=`<div class="album-item"><span>${rec.name}</span><span><span class="stars">${'★'.repeat(rec.star)}${'☆'.repeat(3-rec.star)}</span> · ${fmt(rec.time)}</span></div>`;
  });
  html+=`<div class="row" style="margin-top:18px"><button class="tool-btn" onclick="closeModal()">Close</button></div>`;
  $('modalBody').innerHTML=html; $('overlay').classList.add('show');
}
function showSetting(){
  $('modalBody').innerHTML=`
    <h2 style="font-size:20px;font-weight:800;margin-bottom:12px">⚙ Settings</h2>
    <div style="text-align:left;display:flex;flex-direction:column;gap:12px;font-size:14px">
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mHard" ${save.settings.hard?'checked':''}> Hardcore (no live error check)</label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mSound" ${save.settings.sound?'checked':''}> Sound</label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mDark" ${save.settings.dark?'checked':''}> Dark mode</label>
    </div>
    <div class="row" style="margin-top:18px"><button class="tool-btn primary" onclick="applySetting()">Save</button></div>`;
  $('overlay').classList.add('show');
}
function applySetting(){
  save.settings.hard=$('mHard').checked; save.settings.sound=$('mSound').checked; save.settings.dark=$('mDark').checked;
  saveData(); syncSettings(); closeModal();
}
window.closeModal=()=>$('overlay').classList.remove('show');
function backToMenu(){
  state.view='menu';
  $('viewGame').style.display='none';
  $('viewMenu').style.display='block';
  renderMenu();
}

/* ================= 每日挑战 ================= */
function loadDaily(){
  const d=new Date();
  const seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  const lib=PUZZLES.standard;
  const p=lib[seed%lib.length];
  startPuzzle('standard',p);
}

/* ================= 事件绑定 ================= */
function syncToolSeg(){
  document.querySelectorAll('#toolSeg button').forEach(b=>b.classList.toggle('active',b.dataset.tool===state.tool));
}
function syncSettings(){
  $('chkHard').checked=save.settings.hard;
  $('chkSound').checked=save.settings.sound;
  document.documentElement.classList.toggle('dark',save.settings.dark);
}

$('toolSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.tool=b.dataset.tool; syncToolSeg(); refreshClueHighlight(); tone(600,0.05);
});
$('btnUndo').onclick=undo;
$('btnHint').onclick=doHint;
$('btnReset').onclick=resetBoard;
$('btnNew').onclick=randomOther;
$('btnBack').onclick=backToMenu;
$('btnAlbum').onclick=showAlbum;
$('btnSetting').onclick=showSetting;
$('btnDaily').onclick=loadDaily;
$('btnDark').onclick=()=>{ save.settings.dark=!save.settings.dark; saveData(); syncSettings(); };
$('chkHard').onchange=e=>{ save.settings.hard=e.target.checked; saveData(); };
$('chkSound').onchange=e=>{ save.settings.sound=e.target.checked; saveData(); };
window.addEventListener('pointerup',()=>{ state.dragValue=null; });

/* ================= 启动 ================= */
syncSettings();
renderMenu();
</script>
</body>
</html>
