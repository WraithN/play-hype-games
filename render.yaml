# Render 部署配置（Blueprint）
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: play-hype-games
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "zero-dependency project, no build needed"
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 后台密码：部署后在 Render 控制台填写，不要写进仓库
      - key: ADMIN_PASSWORD
        sync: false
